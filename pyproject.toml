[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "loupmd"
dynamic = ["version"]
description = "Molecular dynamics with MACE potentials on a C++/CUDA engine"
requires-python = ">=3.10"
# MIT for LoupMD; BSD-3-Clause for the tensor-core GEMM kernels compiled from CUTLASS headers; LGPL-2.1-or-later
# for the modules ported from ASE (PLAN.md decision O6). NOTICE.md lists the files of each.
license = "MIT AND BSD-3-Clause AND LGPL-2.1-or-later"
license-files = ["LICENSE", "NOTICE.md", "cubins/LICENSE.cutlass", "LICENSES/LGPL-2.1-or-later.txt"]
authors = [{ name = "Fabian Zwingel" }]
keywords = ["molecular dynamics", "MACE", "machine-learned interatomic potentials", "CUDA"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
# The runtime needs no torch and no compiler. The CUDA 13 runtime, cuBLAS and cuFFT (the split dispersion sum, opened
# only when used; PLAN.md D79) come from the NVIDIA wheels, pinned
# exactly as torch 2.14.1+cu130 pins them (cuda-toolkit 13.0.3: nvidia-cuda-runtime 13.0.96, nvidia-cublas
# 13.1.1.3), so that the export extra's torch and the engine load the same libraries.
dependencies = [
    "numpy>=1.26",
    "ase>=3.23",
    "tomli>=2; python_version < '3.11'",
    "cuda-toolkit[cublas,cudart,cufft]==13.0.3; platform_system == 'Linux'",
]

[project.optional-dependencies]
# Exporting a model to a bundle and computing gate references: the versions the exporters were tested with.
export = [
    "torch==2.14.1",
    "mace-torch==0.3.16",
    "cuequivariance==0.12.0",
    "cuequivariance-torch==0.12.0",
]
dev = [
    "pytest>=8",
    "tomli>=2; python_version < '3.11'",
    "build>=1.2",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.29",
]

[project.scripts]
loupmd = "loupmd.cli:main"

[tool.setuptools.dynamic]
version = { attr = "loupmd.__version__" }

[tool.setuptools.packages.find]
include = ["loupmd*"]

[tool.setuptools.package-data]
# _lib/ is filled by the wheel build (PLAN.md S2-T02) and is not tracked: the library, the tensor-core cubins, the
# kernel manifest, and what `loupmd build-kernels` compiles a plugin from (three headers and the generator).
loupmd = ["_lib/*.so", "_lib/cubins/*", "_lib/generated_generic_manifest.json", "_lib/kernel-src/*",
          "bench/reference.json", "bench/structures/*", "export/_vendor/VERSION", "data/d3_tables.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fast: the fast tier of tests/gpu, every GPU test not marked otherwise (under ten minutes)",
    "full: the full tier of tests/gpu: long runs, statistics, step costs, model families",
    "acceptance: the accuracy gate per model family (exports and float64 references)",
]
